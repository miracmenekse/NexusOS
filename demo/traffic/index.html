<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusOS · Servis trafiği</title>
<style>
  :root { --bg: #070b14; --fg: #cfe3ff; --dim: #4a5b78; --ok: #4fd1ff; --err: #ff4d5e; --node: #13203a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  header { position: fixed; top: 16px; left: 20px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .08em; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--dim); }
  #panel { position: fixed; right: 20px; bottom: 20px; width: 300px; background: #0d1628ee; border: 1px solid #22355a;
           border-radius: 10px; padding: 14px; display: none; }
  #panel h2 { margin: 0 0 8px; font-size: 16px; }
  #panel .bad { color: var(--err); }
  #panel code { color: #9fb7dc; word-break: break-all; }
  #saglik { position: fixed; top: 64px; left: 20px; display: flex; gap: 14px; align-items: center; font-size: 13px; color: #9fb0cc; }
  #saglik .d { padding: 3px 12px; border-radius: 999px; font-weight: 600; border: 1px solid; }
  .s-saglikli { color: #6ee7a0; border-color: #6ee7a066; } .s-dikkat { color: #ffb84d; border-color: #ffb84d66; } .s-sorun { color: #ff6b78; border-color: #ff4d5e; background: #2a0d14; }
  #saglik b { color: #cfe3ff; font-variant-numeric: tabular-nums; }
  #alarmlar { position: fixed; top: 16px; right: 20px; width: 310px; display: grid; gap: 8px; max-height: 55vh; overflow: auto; }
  .alarm { background: #2a0d14ee; border: 1px solid #ff4d5e; border-radius: 10px; padding: 9px 12px; font-size: 13px; box-shadow: 0 0 18px #ff4d5e55; }
  .alarm.kapali { background: #0d1628cc; border-color: #22355a; box-shadow: none; color: #9fb0cc; font-size: 12px; padding: 6px 10px; }
  .alarm b { color: #fff; } .alarm small { display: block; color: #e9b0b6; margin-top: 3px; } .alarm.kapali small { color: #6b7fa3; }
  .alarm a, #panel a { color: #4fd1ff; text-decoration: none; }
  #ariza { position: fixed; left: 20px; bottom: 44px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #6b7fa3; max-width: 60vw; }
  #ariza button { background: #13203a; color: #cfe3ff; border: 1px solid #2c4a7c; border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
  #ariza button.on { border-color: #ff4d5e; color: #ff9aa5; }
  #panel svg { width: 100%; height: 56px; display: block; margin: 4px 0 2px; }
  #legend { position: fixed; left: 20px; bottom: 16px; color: var(--dim); }
  #legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 12px; vertical-align: middle; }
</style>
</head>
<body>
<header><h1>NEXUSOS · SERVİS TRAFİĞİ</h1><p>Her nokta bir çağrı. Bir servise dokun: grup açılır, hata hangi dosyada görünür. Esc / boşluk: geri.</p></header>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="saglik"></div>
<div id="alarmlar"></div>
<div id="ariza"></div>
<div id="legend"><b style="background:var(--ok)"></b>başarılı <b style="background:var(--err)"></b>başarısız</div>
<script src="canli-sim.js"></script>
<script>
// services, their files and who calls whom come from the code (GET /yapi); columns = call depth from the user
const Y = (() => { try { const r = new XMLHttpRequest(); r.open("GET", "/yapi", false); r.send(); return JSON.parse(r.responseText); }
  catch { return { services: [], calls: [] }; } })();
const NODES = { user: { label: "kullanıcı", x: .08, y: .5, files: [] } };
{
  const derin = {}, cagrilan = new Set(Y.calls.map(c => c[1]));
  const git = (s, d) => { if ((derin[s] ?? -1) >= d) return; derin[s] = d; for (const [a, b] of Y.calls) if (a === s) git(b, d + 1); };
  for (const s of Y.services) if (!cagrilan.has(s.name)) git(s.name, 1);
  const enDerin = Math.max(1, ...Object.values(derin)), kolon = {};
  for (const s of Y.services) (kolon[derin[s.name] ?? 1] ??= []).push(s);
  for (const [d, l] of Object.entries(kolon)) l.forEach((s, i) => NODES[s.name] = { label: s.name, x: .08 + .74 * d / enDerin, y: (i + 1) / (l.length + 1),
    files: s.files.map(f => f.file).filter(f => !f.endsWith("/app.py")) });
}
const FILES = {};   // path -> {svc, dx, dy, calls, fails, heat, lastErr}; dx/dy in units of the group's radius
for (const [id, n] of Object.entries(NODES)) {
  Object.assign(n, { calls: 0, fails: 0, lastErr: null, heat: 0 });
  n.files.forEach((f, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n.files.length, d = n.files.length > 1 ? 0.55 : 0;
    FILES[f] = { svc: id, dx: Math.cos(a) * d, dy: Math.sin(a) * d, calls: 0, fails: 0, heat: 0, lastErr: null };
  });
}
const edges = {};   // "a>b" -> {calls, fails, ms}
const particles = [];
let selected = null, focus = null;
const Z_FOCUS = 6;
const cam = { z: 1, cx: 0.5, cy: 0.5 };   // cx/cy: normalized world point at screen center

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
const R0 = () => Math.min(cv.width, cv.height) * 0.06;
const P = n => [(n.x - cam.cx) * cv.width * cam.z + cv.width / 2, (n.y - cam.cy) * cv.height * cam.z + cv.height / 2];
const R = () => R0() * cam.z;
const open = () => Math.min(1, Math.max(0, (cam.z - 1) / (Z_FOCUS - 1)));   // 0 = overview, 1 = group fully open
function FP(f) { const [x, y] = P(NODES[f.svc]); return [x + f.dx * R(), y + f.dy * R()]; }
// where a call touches a service: its file when the group is open, else the service circle
function endPt(id, file) {
  const n = NODES[id], f = FILES[file], [x, y] = P(n);
  if (!f || id !== focus) return [x, y];
  const [fx, fy] = FP(f), o = open();
  return [x + (fx - x) * o, y + (fy - y) * o];
}

function curve(p1, p2, t) {   // quadratic bezier bowed sideways so both directions stay apart
  const [x1, y1] = p1, [x2, y2] = p2;
  const mx = (x1 + x2) / 2 - (y2 - y1) * 0.15, my = (y1 + y2) / 2 + (x2 - x1) * 0.15;
  const u = 1 - t;
  return [u * u * x1 + 2 * u * t * mx + t * t * x2, u * u * y1 + 2 * u * t * my + t * t * y2];
}

new EventSource("events").onmessage = (m) => {
  const e = JSON.parse(m.data);
  const a = NODES[e.from], b = NODES[e.to];
  if (!a || !b) return;
  const k = e.from + ">" + e.to;
  const ed = edges[k] ??= { a, b, calls: 0, fails: 0, ms: 0 };
  ed.calls++; ed.ms += e.ms;
  b.calls++;
  const tf = FILES[e.toFile], ff = FILES[e.fromFile];
  if (tf) tf.calls++;
  if (!e.ok) {
    ed.fails++; b.fails++; b.heat = 1;
    b.lastErr = { path: e.path, detail: e.detail, from: e.from, fromFile: e.fromFile, toFile: e.toFile };
    if (tf) { tf.fails++; tf.heat = 1; tf.lastErr = b.lastErr; }
  }
  kaydet(e);
  particles.push({ a, b, ia: e.from, ib: e.to, fa: e.fromFile, fb: e.toFile, t: 0, ok: e.ok, v: 0.012 + Math.random() * 0.01 });
  if (selected) showPanel(selected);
};

function draw() {
  const tz = focus ? Z_FOCUS : 1, tn = focus ? NODES[focus] : { x: .5, y: .5 };   // ease camera toward target
  cam.z += (tz - cam.z) * 0.08; cam.cx += (tn.x - cam.cx) * 0.08; cam.cy += (tn.y - cam.cy) * 0.08;
  const o = open(), D = devicePixelRatio;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const r = R();
  ctx.globalAlpha = 1 - o * 0.85;
  for (const ed of Object.values(edges)) {          // edges: width by volume, red tint by error share
    const share = ed.fails / ed.calls, pa = P(ed.a), pb = P(ed.b);
    ctx.strokeStyle = share > 0.2 ? "rgba(255,77,94,.35)" : "rgba(79,209,255,.18)";
    ctx.lineWidth = Math.min(2 + Math.log2(ed.calls + 1) * 1.5, 14) * D;
    ctx.beginPath();
    for (let t = 0; t <= 1.001; t += 0.05) { const [x, y] = curve(pa, pb, t); t ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (let i = particles.length - 1; i >= 0; i--) {   // particles; inside an open group they run file to file
    const p = particles[i]; p.t += p.v;
    if (p.t >= 1) { particles.splice(i, 1); continue; }
    const [x, y] = curve(endPt(p.ia, p.fa), endPt(p.ib, p.fb), p.t);
    ctx.fillStyle = p.ok ? "#4fd1ff" : "#ff4d5e";
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12 * D;
    ctx.beginPath(); ctx.arc(x, y, (p.ok ? 3 : 5) * D, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
  for (const [id, n] of Object.entries(NODES)) {     // groups: red pulse after a failure
    const [x, y] = P(n), mine = id === focus;
    n.heat *= 0.985;
    ctx.globalAlpha = focus && !mine ? 1 - o * 0.9 : 1;
    ctx.fillStyle = "#13203a";
    const sv = SAG[id]?.seviye;
    ctx.strokeStyle = sv === "sorun" ? "#ff4d5e" : n.heat > 0.05 ? `rgba(255,77,94,${0.4 + n.heat * 0.6})` : sv === "dikkat" ? "#ffb84d" : sv === "saglikli" ? "#3fae7a" : "#2c4a7c";
    ctx.lineWidth = (selected === id ? 5 : 3) * D;
    ctx.beginPath(); ctx.arc(x, y, r * (1 + n.heat * 0.15), 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#cfe3ff"; ctx.textAlign = "center";
    if (mine && o > 0.3) {                           // opened: title on top, files inside
      ctx.font = `${16 * D}px system-ui`; ctx.fillText(n.label, x, y - r - 14 * D);
    } else {
      ctx.font = `${14 * D}px system-ui`; ctx.fillText(n.label, x, y + 5 * D);
      const m = SAG[id];
      if (m?.n) {
        ctx.fillStyle = m.seviye === "sorun" ? "#ff8b96" : m.seviye === "dikkat" ? "#ffcf8a" : "#7fa8d6";
        ctx.font = `${11 * D}px system-ui`;
        ctx.fillText(`${m.rps.toFixed(1)}/sn · %${m.hata.toFixed(0)} hata · p95 ${m.p95.toFixed(0)} ms`, x, y + r + 18 * D);
      }
    }
    ctx.globalAlpha = 1;
  }
  if (focus && o > 0.3) drawFiles(NODES[focus], (o - 0.3) / 0.7);
  requestAnimationFrame(draw);
}
function drawFiles(n, a) {
  const D = devicePixelRatio, fr = R() * 0.2;
  ctx.globalAlpha = a;
  for (const f of n.files) {
    const s = FILES[f], [x, y] = FP(s), bad = s.heat > 0.05;
    s.heat *= 0.985;
    ctx.fillStyle = "#0d1a30";
    ctx.strokeStyle = bad ? `rgba(255,77,94,${0.4 + s.heat * 0.6})` : "#2c4a7c";
    ctx.lineWidth = (selected === f ? 4 : 2) * D;
    ctx.beginPath(); ctx.arc(x, y, fr * (1 + s.heat * 0.12), 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#cfe3ff"; ctx.textAlign = "center"; ctx.font = `${12 * D}px system-ui`;
    ctx.fillText(f.split("/").pop(), x, y + 4 * D);
    ctx.font = `${10 * D}px system-ui`; ctx.fillStyle = "#4a5b78";
    ctx.fillText(f.split("/").slice(0, -1).join("/"), x, y - fr - 6 * D);
    if (s.fails) { ctx.fillStyle = "#ff8b96"; ctx.fillText(`${s.fails} hata`, x, y + fr + 14 * D); }
  }
  ctx.globalAlpha = 1;
}
// ---- operations: health per service from the last 30 s, 5-min history, alarms with root cause (O1-O5)
// SLO levels (4.3 §9): healthy < 10 % errors and p95 < 100 ms; problem > 40 % or > 300 ms; in between: watch
const SLO = { hata: [10, 40], p95: [100, 300] }, PENCERE = 30e3, KOVA = 5e3, ALARM_SN = 10e3;
const SEV = { saglikli: "sağlıklı", dikkat: "dikkat", sorun: "sorun" };
const CAGRI = {}, SAG = {}, GECMIS = {}, ALARM = {}, KAPANAN = [];
function kaydet(e) { (CAGRI[e.to] ??= []).push({ t: performance.now(), ok: e.ok, ms: e.ms }); }
const p95 = l => { if (!l.length) return 0; const x = l.map(c => c.ms).sort((a, b) => a - b); return x[Math.min(x.length - 1, Math.floor(x.length * .95))]; };
const seviye = (hata, p) => hata > SLO.hata[1] || p > SLO.p95[1] ? "sorun" : hata >= SLO.hata[0] || p >= SLO.p95[0] ? "dikkat" : "saglikli";
const SIRA = { saglikli: 0, dikkat: 1, sorun: 2 };
function olc() {
  const simdi = performance.now();
  for (const id of Object.keys(NODES)) {
    if (id === "user") continue;
    const l = (CAGRI[id] ||= []).filter(c => simdi - c.t < 5 * 60e3); CAGRI[id] = l;
    const son = l.filter(c => simdi - c.t < PENCERE), hata = son.length ? 100 * son.filter(c => !c.ok).length / son.length : 0, p = p95(son);
    SAG[id] = { n: son.length, rps: son.length / (PENCERE / 1000), hata, p95: p, seviye: son.length ? seviye(hata, p) : null };
  }
  // root cause: a service in trouble none of whose callees is in trouble (the problem starts there and travels up)
  const sorunlu = new Set(Object.keys(SAG).filter(id => SAG[id].seviye === "sorun"));
  for (const id of Object.keys(SAG)) {
    const a = ALARM[id], kotu = sorunlu.has(id);
    if (kotu) {
      const kok = [...sorunlu].filter(x => !Y.calls.some(([f, t]) => f === x && sorunlu.has(t)) && (x === id || ulasir(id, x)));
      if (!a) ALARM[id] = { bas: simdi, temiz: null, tepe: { ...SAG[id] }, kok, acik: false };
      else { a.temiz = null; a.kok = kok; if (SAG[id].hata > a.tepe.hata) a.tepe.hata = SAG[id].hata; if (SAG[id].p95 > a.tepe.p95) a.tepe.p95 = SAG[id].p95;
        if (!a.acik && simdi - a.bas >= ALARM_SN) a.acik = true; }
    } else if (a) {
      a.temiz ??= simdi;
      if (!a.acik) delete ALARM[id];                                     // never confirmed: drop quietly
      else if (simdi - a.temiz >= ALARM_SN) { KAPANAN.unshift({ id, ...a, bit: simdi }); KAPANAN.length = Math.min(KAPANAN.length, 12); delete ALARM[id]; }
    }
  }
  saglikCiz(); alarmCiz();
  if (selected && NODES[selected]) showPanel(selected);
}
function ulasir(a, b) { const gor = new Set([a]), q = [a]; while (q.length) { const x = q.shift(); for (const [f, t] of Y.calls) if (f === x && !gor.has(t)) { if (t === b) return true; gor.add(t); q.push(t); } } return false; }
setInterval(olc, 1000);
setInterval(() => {   // 5 s buckets for the 5-min curve
  for (const [id, m] of Object.entries(SAG)) { const g = GECMIS[id] ??= []; g.push({ hata: m.hata, p95: m.p95 }); if (g.length > 60) g.shift(); }
}, KOVA);
const sure = ms => ms < 60e3 ? `${Math.round(ms / 1000)} sn` : `${Math.floor(ms / 60e3)} dk ${Math.round(ms % 60e3 / 1000)} sn`;
function saglikCiz() {
  const l = Object.values(SAG).filter(m => m.n), en = l.reduce((a, m) => SIRA[m.seviye] > SIRA[a] ? m.seviye : a, "saglikli");
  const giris = SAG[Y.calls.find(c => !Y.calls.some(d => d[1] === c[0]))?.[0]] || {};   // the entry service = the user's view
  document.getElementById("saglik").innerHTML = l.length ? `<span class="d s-${en}">${en === "saglikli" ? "● Sağlıklı" : en === "dikkat" ? "● Dikkat" : "● Sorun"}</span>
    <span>giriş: <b>${(giris.rps ?? 0).toFixed(1)}</b>/sn · hata <b>%${(giris.hata ?? 0).toFixed(0)}</b> · p95 <b>${(giris.p95 ?? 0).toFixed(0)} ms</b></span>
    <span>${l.filter(m => m.seviye !== "saglikli").length ? Object.entries(SAG).filter(([, m]) => m.seviye && m.seviye !== "saglikli").map(([id, m]) => `${id}: ${SEV[m.seviye]}`).join(" · ") : "tüm servisler sağlıklı"}</span>` : "veri bekleniyor…";
}
function alarmCiz() {   // one card per root cause; the services it drags along are listed on it
  const simdi = performance.now(), grup = {};
  for (const [id, a] of Object.entries(ALARM)) if (a.acik) for (const k of a.kok.length ? a.kok : [id]) (grup[k] ??= []).push([id, a]);
  const kart = (k, l) => { const kok = l.find(([id]) => id === k)?.[1] || l[0][1], diger = l.map(([id]) => id).filter(id => id !== k);
    return `<div class="alarm">🔴 <b>${k}</b> ${sure(simdi - Math.min(...l.map(([, a]) => a.bas)))}'dir sorunlu
      <small>tepe: hata %${kok.tepe.hata.toFixed(0)} · p95 ${kok.tepe.p95.toFixed(0)} ms</small>
      <small>${diger.length ? `etkilenen: <b>${diger.join(", ")}</b> (${k} servisini çağırdıkları için)` : "başka servis etkilenmedi"} · <a href="${window.SEHIR || "/sehir"}#${k}">kodda gör →</a></small></div>`; };
  const kapanan = KAPANAN.filter(k => !k.kok.length || k.kok.includes(k.id));   // history: root causes only
  document.getElementById("alarmlar").innerHTML = Object.entries(grup).map(([k, l]) => kart(k, l)).join("")
    + kapanan.map(k => `<div class="alarm kapali">✓ ${k.id} alarmı kapandı · ${sure(k.bit - k.bas)} sürdü<small>tepe: hata %${k.tepe.hata.toFixed(0)} · p95 ${k.tepe.p95.toFixed(0)} ms</small></div>`).join("");
}
// O6: try a fault (demo): slow a service down or make it fail, without restarting anything
const ARIZALAR = [["payments", { gecikme_ms: 800 }, "payments yavaşlasın (800 ms)"], ["inventory", { hata: 0.8 }, "inventory çöksün (%80 hata)"]];
let ariza = {};
async function arizaYaz(a) { ariza = await fetch("/ariza", { method: "POST", body: JSON.stringify(a) }).then(r => r.json()).catch(() => ariza); arizaCiz(); }
function arizaCiz() {
  document.getElementById("ariza").innerHTML = "arıza dene:" + ARIZALAR.map(([svc, , ad], i) => `<button data-i="${i}" class="${ariza[svc] ? "on" : ""}">${ad}</button>`).join("")
    + `<button data-i="x">temizle</button>`;
}
document.getElementById("ariza").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.i === "x") return arizaYaz({});
  const [svc, v] = ARIZALAR[b.dataset.i], a = { ...ariza }; a[svc] ? delete a[svc] : (a[svc] = v); arizaYaz(a); };
fetch("/ariza").then(r => r.json()).then(a => { ariza = a; arizaCiz(); }).catch(arizaCiz);

draw();

const panel = document.getElementById("panel");
function showPanel(id) {
  const f = FILES[id], n = NODES[f ? f.svc : id];
  if (f) {   // file: where did the failure come from?
    const e = f.lastErr;
    panel.innerHTML = `<h2>${id.split("/").pop()}</h2><p><code>${id}</code></p><p>${f.calls} çağrı aldı, <span class="${f.fails ? "bad" : ""}">${f.fails} başarısız</span></p>` +
      (e ? `<p class="bad">Hata kaynağı: <code>${e.fromFile || e.from}</code> → <code>${e.toFile}</code> (${e.path})<br><code>${JSON.stringify(e.detail)}</code></p>` : "");
    panel.style.display = "block"; return;
  }
  const inbound = Object.entries(edges).filter(([k]) => k.endsWith(">" + id));
  const rows = inbound.map(([k, e]) => `<li>${k.split(">")[0]} → ${e.calls} çağrı, ${e.fails} hata, ort. ${(e.ms / e.calls).toFixed(1)} ms</li>`).join("");
  const bad = n.files.filter(x => FILES[x].fails).map(x => `<li class="bad">${x} · ${FILES[x].fails} hata</li>`).join("");
  const err = n.lastErr ? `<p class="bad">Son hata: ${n.lastErr.from} → <code>${n.lastErr.path}</code><br><code>${JSON.stringify(n.lastErr.detail)}</code></p>` : "";
  const m = SAG[id] || {}, g = GECMIS[id] || [];
  const egri = (l, maks, renk) => { if (l.length < 2) return ""; const pts = l.map((v, i) => `${i / (l.length - 1) * 100},${50 - Math.min(1, v / maks) * 46}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${renk}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`; };
  const ust = `<p class="${m.seviye === "sorun" ? "bad" : ""}">Son 30 sn: <b>${(m.rps ?? 0).toFixed(1)}</b>/sn · hata <b>%${(m.hata ?? 0).toFixed(0)}</b> · p95 <b>${(m.p95 ?? 0).toFixed(0)} ms</b> · ${SEV[m.seviye] || "veri yok"}</p>
    <div style="font-size:11px;color:#6b7fa3">son 5 dk · <span style="color:#ff8b96">hata %</span> · <span style="color:#ffcf8a">p95 (300 ms = üst)</span></div>
    <svg viewBox="0 0 100 50" preserveAspectRatio="none"><line x1="0" x2="100" y1="${50 - 40 / 100 * 46}" y2="${50 - 40 / 100 * 46}" stroke="#ff4d5e44" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>${egri(g.map(b => b.hata), 100, "#ff8b96")}${egri(g.map(b => b.p95), 300, "#ffcf8a")}</svg>
    <p><a href="${window.SEHIR || "/sehir"}#${id}">kodda gör (Ç1) →</a></p>`;
  panel.innerHTML = `<h2>${n.label}</h2>` + ust + `<p>Toplam ${n.calls} çağrı aldı, <span class="${n.fails ? "bad" : ""}">${n.fails} başarısız</span></p><ul>${rows || "<li>henüz çağrı yok</li>"}</ul>${bad ? `<p>Hata veren dosyalar:</p><ul>${bad}</ul>` : ""}${err}`;
  panel.style.display = "block";
}
function select(id) { selected = id; id ? showPanel(id) : (panel.style.display = "none"); }
cv.addEventListener("click", (ev) => {
  const x = ev.clientX * devicePixelRatio, y = ev.clientY * devicePixelRatio;
  if (focus && open() > 0.6) {                       // inside an open group: pick a file, or leave
    const hit = NODES[focus].files.find(f => { const [fx, fy] = FP(FILES[f]); return Math.hypot(fx - x, fy - y) < R() * 0.2; });
    if (hit) return select(hit);
    const [nx, ny] = P(NODES[focus]);
    if (Math.hypot(nx - x, ny - y) > R()) { focus = null; select(null); }
    return;
  }
  const hit = Object.entries(NODES).find(([id, n]) => n.files.length && Math.hypot(P(n)[0] - x, P(n)[1] - y) < R());
  focus = hit ? hit[0] : null;                       // first click zooms into the group
  select(focus);
});
addEventListener("keydown", (e) => { if (e.key === "Escape") { focus = null; select(null); } });
</script>
</body>
