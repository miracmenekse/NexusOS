<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusOS · Ç1 Neon kod şehri</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #e9edf3; color: #1d2433; }
  h1 { font-size: 20px; margin: 20px 24px 4px; } .lead { margin: 0 24px 16px; color: #5b6578; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; padding: 0 24px 24px; }
  .card { border-radius: 14px; overflow: hidden; box-shadow: 0 4px 18px #0002; background: #fff; }
  .card h2 { font-size: 15px; margin: 0; padding: 12px 16px 2px; } .card p { margin: 0; padding: 0 16px 12px; color: #5b6578; }
  svg { display: block; width: 100%; height: auto; }
  .a .stage { background: radial-gradient(circle at 50% 40%, #12223f, #05080f 70%); }
  .pulse { animation: p 1.4s ease-in-out infinite; } @keyframes p { 50% { opacity: .35 } }
  .flow { stroke-dasharray: 4 10; animation: f 1.2s linear infinite; } @keyframes f { to { stroke-dashoffset: -28 } }
  #a { cursor: pointer; }
  #a [data-s], #a [data-c] { transition: opacity .6s; }
  #a[data-f] [data-s]:not(.fl), #a[data-f] [data-c] { opacity: .08; }
  .fl { opacity: 0; font: 600 6.5px system-ui; fill: #cfe3ff; text-anchor: middle; pointer-events: none; }
  #a[data-f] [data-s].on { opacity: 1; }
  #a[data-f] .fl[data-s].on { opacity: 1; }
  #a[data-f] [data-c].hot { opacity: .9; }
  #a[data-f] .src.warn { fill: #ffb84d; }
  .a .stage { position: relative; }
  #uy { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; width: 250px; z-index: 5; }
  .toast { background: #2a0d14ee; border: 1px solid #ff4d5e; border-radius: 10px; padding: 7px 10px; color: #ffd0d5; font-size: 12px; cursor: pointer; box-shadow: 0 0 16px #ff4d5e66; animation: tin .3s; }
  .toast b { color: #fff; } .toast small { display: block; color: #ff9aa5; } @keyframes tin { from { opacity: 0; transform: translateX(20px); } }
  #chip { position: absolute; top: 10px; left: 10px; z-index: 5; border-radius: 999px; padding: 3px 12px; font-size: 12px; background: #0d1628cc; border: 1px solid #22355a; color: #9fc4ff; }
  #chip.bad { background: #2a0d14; border-color: #ff4d5e; color: #ffd0d5; animation: pu 1.2s infinite; } @keyframes pu { 50% { box-shadow: 0 0 14px #ff4d5e; } }
  #hata { display: none; position: absolute; left: 10px; bottom: 10px; width: min(470px, calc(100% - 20px)); max-height: 78%; overflow: auto; z-index: 6; background: #0b1020f2; border: 1px solid #ff4d5e; border-radius: 12px; padding: 10px 12px; color: #dfe6f5; box-shadow: 0 0 24px #ff4d5e55; font-size: 12px; }
  #hata h3 { margin: 0 0 4px; font-size: 14px; color: #ff9aa5; } #hata .x { float: right; cursor: pointer; color: #9fb0cc; }
  #hata code, #hata pre { font: 11px/1.45 ui-monospace, monospace; } #hata pre { background: #05080f; border-radius: 8px; padding: 6px 0; margin: 6px 0 0; overflow: auto; }
  #hata pre div { padding: 0 10px; white-space: pre; } #hata pre .hl { background: #ff4d5e33; border-left: 3px solid #ff4d5e; padding-left: 7px; } #hata pre .ln { color: #566079; margin-right: 10px; }
  #hata .flow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; } #hata .flow span { background: #13203a; border: 1px solid #2b4a7a; border-radius: 6px; padding: 1px 7px; }
  #hata ul { margin: 4px 0 0; padding-left: 18px; color: #9fb0cc; }
  .cap button { margin-left: 6px; background: #ff4d5e; color: #fff; border: 0; border-radius: 6px; padding: 1px 8px; cursor: pointer; font: inherit; }
  .cap { display: none; margin: 0 16px 12px; padding: 8px 12px; border-radius: 8px; background: #12223f; color: #ffd0d5; }
  .cap b { color: #fff; }
</style>
</head>
<body>
<h1>Ç1 · Neon kod şehri</h1>
<p class="lead">Binalar <code>services/</code> kodundan okunuyor (yükseklik = satır sayısı, yaylar = koddaki çağrılar); renkler canlı trafikten.</p>
<div class="grid">
  <div class="card a"><div class="stage"><svg id="a" viewBox="0 0 640 420"></svg><div id="chip">● hata yok</div><div id="uy"></div><div id="hata"></div></div>
    <p><b>Bir servise dokun: gruba yakınlaşır, hata kaynağı içeride görünür.</b> <span id="durum">canlı akış bağlanıyor…</span></p><div class="cap" id="acap"></div></div>
</div>
<script>
// structure comes from the code: GET /yapi (traffic/yapi.py reads services/ with ast)
// ponytail: senkron istek; sayfa yalnız :4400/sehir'den açılır, yapı küçük
const Y = (() => { try { const r = new XMLHttpRequest(); r.open("GET", "/yapi", false); r.send(); return JSON.parse(r.responseText); }
  catch { return { services: [], calls: [] }; } })();
const S = Y.services.map((s, i) => [s.name, i % 2, Math.floor(i / 2),   // service, grid x,y, files [name, height, calls]
  s.files.map(f => [f.file.split("/").pop(), 1 + f.lines / 5, f.calls || null])]);
const CALLS = Y.calls;
const NS = "http://www.w3.org/2000/svg";
const REG = {}, CP = {};   // live view: file key "svc/file.py" -> svg parts; "a>b" -> call arc
let cur = null, curCall = null;   // service / call being drawn: lets the zoom dim everything else
function el(svg, tag, attrs, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text;
  if (cur) e.setAttribute("data-s", cur); if (curCall) e.setAttribute("data-c", curCall);
  svg.appendChild(e); return e; }
// isometric projection
const iso = (x, y, z, o) => [o.x + (x - y) * o.k, o.y + (x + y) * o.k * 0.5 - z];
function box(svg, x, y, w, d, h, o, col, cls) {   // col = [top, left, right]
  const p = (a, b, c) => iso(a, b, c, o).join(",");
  const sl = el(svg, "polygon", { points: [p(x, y + d, 0), p(x + w, y + d, 0), p(x + w, y + d, h), p(x, y + d, h)].join(" "), fill: col[1], ...(cls && { class: cls }) });
  const sr = el(svg, "polygon", { points: [p(x + w, y, 0), p(x + w, y + d, 0), p(x + w, y + d, h), p(x + w, y, h)].join(" "), fill: col[2], ...(cls && { class: cls }) });
  const top = el(svg, "polygon", { points: [p(x, y, h), p(x + w, y, h), p(x + w, y + d, h), p(x, y + d, h)].join(" "), fill: col[0], ...(cls && { class: cls }) });
  top._f = [sl, sr]; return top;
}
function layout(o) {   // service plates + building positions
  const out = {};
  for (const [name, gx, gy, files] of S) {
    const px = gx * 8.5, py = gy * 8.5;
    out[name] = { px, py, files: files.map((f, i) => ({ f, x: px + 0.8 + (i % 3) * 1.9, y: py + 0.8 + Math.floor(i / 3) * 1.9 })) };
  }
  return out;
}
function center(L, n, o) { const s = L[n]; return iso(s.px + 2.75, s.py + 2.75, 6, o); }
function draw(id, th) {
  const svg = document.getElementById(id), o = th.o, L = layout(o);
  for (const [name] of S) {
    const s = L[name]; cur = name;
    box(svg, s.px, s.py, 5.5, 5.5, 4, o, th.plate);
    const [lx, ly] = iso(s.px, s.py + 5.5, 0, o);
    el(svg, "text", { x: lx + 4, y: ly + 18, "text-anchor": "start", "font-size": th.label, fill: th.text, "font-weight": 600 }, name);
  }
  cur = null;
  for (const [a, b] of CALLS) {
    curCall = a + ">" + b;   // calls drawn before buildings of the far plates
    const [x1, y1] = center(L, a, o), [x2, y2] = center(L, b, o);
    const d = `M${x1},${y1} Q${(x1 + x2) / 2},${Math.min(y1, y2) - 70} ${x2},${y2}`;
    const bp = el(svg, "path", { d, fill: "none", stroke: th.call, "stroke-width": th.callW, opacity: .8 });
    el(svg, "path", { d, fill: "none", stroke: "#e6fbff", "stroke-width": 2.5, class: "flow" });
    CP[a + ">" + b] = { bp, th };
  }
  curCall = null;
  const order = S.flatMap(([n]) => L[n].files.map(b => ({ ...b, n }))).sort((p, q) => (p.x + p.y) - (q.x + q.y));
  for (const { f: [file, h, src], x, y, n } of order) {   // src: services this file calls; it turns amber when such a call fails
    cur = n;
    const top = box(svg, x, y, 1.2, 1.2, 4 + h * 9, o, th.good, src ? "src" : null);
    el(svg, "text", { x: iso(x + 0.6, y + 0.6, 0, o)[0], y: iso(x + 0.6, y + 0.6, 4 + h * 9, o)[1] - 6, class: "fl" }, file);
    const [tx, ty] = iso(x + 0.6, y + 0.6, 4 + h * 9, o);
    REG[n + "/" + file] = { top, th, src,
      c: el(svg, "circle", { cx: tx, cy: ty - 14, r: 16, fill: "#ff4d5e33", visibility: "hidden" }),
      t: el(svg, "text", { x: tx, y: ty - 34, "text-anchor": "middle", "font-size": 12, fill: "#ffb3bb", visibility: "hidden" }) };
  }
  cur = null;
}
const o = { x: 320, y: 80, k: 19 };
draw("a", { o, label: 13, text: "#9fc4ff", callW: 3, call: "#2fd0ff55", callErr: "#ff3b4e88",
  plate: ["#11284a", "#0a1a33", "#0d2140"], good: ["#4fd1ffcc", "#1b6f99cc", "#2a8fc4cc"], bad: ["#ff4d5e", "#a11a2a", "#d02a3c"] });

// A: tap a service -> zoom into the group; the failing file and its sender show inside
const A = document.getElementById("a"), cap = document.getElementById("acap"), L0 = layout(o);
const vb = { x: 0, y: 0, w: 640, h: 420 }; let tgt = { ...vb }, raf;
function go(t) {
  tgt = t; cancelAnimationFrame(raf);
  (function step() {
    let d = 0; for (const k in vb) { vb[k] += (tgt[k] - vb[k]) * 0.12; d += Math.abs(tgt[k] - vb[k]); }
    A.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if (d > 0.5) raf = requestAnimationFrame(step);
  })();
}
function focus(name) {
  if (!name) { A.removeAttribute("data-f"); cap.style.display = "none"; return go({ x: 0, y: 0, w: 640, h: 420 }); }
  const [cx, cy] = center(L0, name, o);
  A.setAttribute("data-f", name); A.querySelectorAll("[data-s]").forEach(e => e.classList.toggle("on", e.dataset.s === name));
  A.querySelectorAll("[data-c]").forEach(e => e.classList.toggle("hot", e.dataset.c.split(">").includes(name)));
  cap.innerHTML = why(name); cap.style.display = "block";
  go({ x: cx - 125, y: cy - 92, w: 250, h: 164 });
}
A.addEventListener("click", ev => {
  if (A.dataset.f) return focus(null);   // zoomed: any tap goes back
  const m = A.getScreenCTM().inverse(), p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m);
  const hit = S.map(([n]) => n).find(n => { const [cx, cy] = center(L0, n, o); return ((p.x - cx) / 110) ** 2 + ((p.y - cy - 10) / 62) ** 2 < 1; });
  if (hit) focus(hit);
});
addEventListener("keydown", e => e.key === "Escape" && focus(null));

// ---- live data: /events from the traffic server (open this page at :4400/sehir) ----
const FILE = {}, EDGE = {}, ago = (x) => performance.now() - (x?.last ?? -1e9), HOT = 4000;
const key = (svc, f) => f ? svc + "/" + f.split("/").pop() : null;
const base = k => k.split("/")[1];
function why(n) {
  const mine = Object.entries(FILE).filter(([k, v]) => k.startsWith(n + "/") && v.fails).sort((a, b) => b[1].last - a[1].last);
  const out = (S.find(s => s[0] === n)?.[3] || []).filter(f => f[2]).flatMap(([f, , to]) => to.map(t => [f, t, EDGE[n + ">" + t]])).filter(([, , e]) => e?.fails);
  if (!mine.length) return out.length ? "Bu grupta hata yok, alt servislerin hataları buradan çıkıyor: " +
      out.map(([f, to, e]) => `<b>${f}</b> → ${to} (${e.fails} hata${ago(e) < HOT ? ", şu an" : ""})`).join("; ") : `<b>${n}</b>: şu an hata yok.`;
  const [k, v] = mine[0], e = v.err;
  return `<button onclick="detay('${k}')">koda git</button> Hata kaynağı: <b>${e.fromFile || e.from}</b> → <b>${e.at || e.toFile}</b> (${e.path}). ${v.fails} hata${ago(v) < HOT ? ", şu an sürüyor" : ", son 4 sn temiz"} · ${e.detail?.reason || JSON.stringify(e.detail)}`;
}
function fly(k, ok) {   // one dot per call along its arc
  const c = CP[k]; if (!c || document.hidden || fly.n > 60) return;
  const len = c.bp.getTotalLength(); fly.n++; curCall = k;
  const dot = el(A, "circle", { r: ok ? 3.5 : 5, fill: ok ? "#4fd1ff" : "#ff4d5e" }); curCall = null;
  let t = 0;
  (function step() { t += 0.018; if (t >= 1) { dot.remove(); fly.n--; return; }
    const p = c.bp.getPointAtLength(t * len); dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); requestAnimationFrame(step); })();
}
fly.n = 0;
const es = new EventSource("/events"), durum = document.getElementById("durum");
es.onopen = () => durum.textContent = "● canlı";
es.onerror = () => durum.textContent = "canlı akış yok (bu sayfayı http://localhost:4400/sehir adresinden aç)";
es.onmessage = m => {
  const e = JSON.parse(m.data), tk = key(e.to, e.at?.split(":")[0] || e.toFile), ek = e.from + ">" + e.to;
  const f = tk && (FILE[tk] ??= { calls: 0, fails: 0, last: -1e9 }), ed = EDGE[ek] ??= { calls: 0, fails: 0, last: -1e9 };
  if (f) f.calls++; ed.calls++;
  if (!e.ok) { if (f) { f.fails++; f.last = performance.now(); f.err = e; } ed.fails++; ed.last = performance.now(); }
  fly(ek, e.ok);
};
setInterval(() => {   // repaint: red while failing, calm again after 4 s without errors
  for (const [k, r] of Object.entries(REG)) {
    const v = FILE[k], bad = v && ago(v) < HOT, ajan = DOKUN[k]?.until > performance.now(), col = bad ? r.th.bad : ajan ? AJAN : r.th.good;
    r.top.setAttribute("fill", col[0]); r.top._f[0].setAttribute("fill", col[1]); r.top._f[1].setAttribute("fill", col[2]);
    r.top.classList.toggle("pulse", !!bad);
    r.c.setAttribute("visibility", bad ? "visible" : "hidden"); r.t.setAttribute("visibility", v?.fails ? "visible" : "hidden");
    if (v?.fails) r.t.textContent = `${base(k)} · ${v.fails} hata`;
    if (ajan && !bad) { r.t.setAttribute("visibility", "visible"); r.t.textContent = `✎ ${DOKUN[k].kim}: ${DOKUN[k].ne}`; }
    if (r.src) r.top.classList.toggle("warn", r.src.some(t => ago(EDGE[svcOf(k) + ">" + t]) < HOT));
    if (r.src) for (const p of r.top._f) p.classList.toggle("warn", r.top.classList.contains("warn"));
  }
  for (const [k, c] of Object.entries(CP)) c.bp.setAttribute("stroke", ago(EDGE[k]) < HOT ? c.th.callErr : c.th.call);
  if (A.dataset.f) cap.innerHTML = why(A.dataset.f);
}, 300);

// ---- agent bridge (G13): when an agent reads or edits a service file (Claude Code, :4500/canli), its building glows
const DOKUN = {}, AJAN = ["#c792eacc", "#6b3fa0cc", "#8f5cc4cc"], NE = { Read: "okudu", Edit: "düzenledi", Write: "yazdı" };
let gorulen = -1;
async function ajanIzle() {
  const m = await fetch(`${location.protocol}//${location.hostname}:4500/canli/oturum.json`, { cache: "no-store" }).then(r => r.json()).catch(() => null);
  if (m?.events) {
    for (const e of gorulen < 0 ? [] : m.events.slice(gorulen)) {   // only what happens after the page opened
      const x = e.kind === "tool" && /^(Read|Edit|Write): (.+\.py)$/.exec(e.text); if (!x) continue;
      const k = Object.keys(REG).find(k => base(k) === x[2]); if (k) DOKUN[k] = { until: performance.now() + 6000, kim: e.agent, ne: NE[x[1]] };
    }
    gorulen = m.events.length;
  }
  setTimeout(ajanIzle, 1500);
}
ajanIzle();

// ---- error view: alert when a file starts failing, chip with active count, detail panel with the failing call and the source
const uy = $a("uy"), chip = $a("chip"), hata = $a("hata"), SRC = {}, HIST = {};
function $a(id) { return document.getElementById(id); }
const svcOf = k => k.split("/")[0];
async function kod(file) { return SRC[file] ??= await fetch("/kod?f=" + encodeURIComponent(file)).then(r => r.ok ? r.text() : "").catch(() => ""); }
function toast(k, v) {
  const e = v.err, t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<b>⚠ ${base(k)}</b> · ${e.detail?.reason || e.path}<small>${e.fromFile || e.from} → ${e.at || svcOf(k)}</small>`;
  t.onclick = () => { t.remove(); focus(svcOf(k)); detay(k); };
  uy.prepend(t); while (uy.children.length > 3) uy.lastChild.remove(); setTimeout(() => t.remove(), 9000);
}
async function detay(k) {
  const v = FILE[k], e = v?.err; if (!e) return;
  const [file, at] = e.at ? e.at.split(":") : [e.toFile], src = await kod(file), lines = src.split("\n");   // at = the line that returned the failure
  const hit = at ? [at - 1] : lines.map((l, i) => /False|raise|error/i.test(l) ? i : -1).filter(i => i >= 0);
  const code = lines.map((l, i) => `<div class="${hit.includes(i) ? "hl" : ""}"><span class="ln">${i + 1}</span>${l.replace(/[<&>]/g, c => ({ "<": "&lt;", "&": "&amp;", ">": "&gt;" }[c]))}</div>`).join("");
  const rec = (HIST[k] || []).slice(-4).reverse().map(h => `<li>${h.t} · ${h.ms.toFixed(0)} ms · ${h.detail?.reason || ""} ${Object.entries(h.detail || {}).filter(([k]) => !["ok", "reason", "at"].includes(k)).map(([k, v]) => k + "=" + v).join(" ")}</li>`).join("");
  hata.innerHTML = `<span class="x" onclick="this.parentNode.style.display='none'">✕</span><h3>⚠ ${base(k)}: ${e.path} başarısız</h3>
    <div class="flow"><span>${e.fromFile || e.from}</span> → <span>${e.at || file}</span></div>${e.detail?.reason ? `<div><b>${e.detail.reason}</b></div>` : ""}
    <div>${v.fails} hata / ${v.calls} çağrı · ${ago(v) < HOT ? "<b style='color:#ff9aa5'>şu an sürüyor</b>" : "son 4 sn temiz"}</div>
    <ul>${rec}</ul>${src ? `<pre>${code}</pre>` : "<div style='color:#7b86a0'>kaynak alınamadı</div>"}`;
  hata.style.display = "block"; hata.dataset.k = k;
}
const prevOn = {};
function sweep() {   // new failure = file was calm and is red now: raise an alert
  let n = 0;
  for (const [k, v] of Object.entries(FILE)) { const on = v.fails && ago(v) < HOT; n += on ? 1 : 0; if (on && !prevOn[k]) toast(k, v); prevOn[k] = !!on; }
  chip.className = n ? "bad" : ""; chip.textContent = n ? `⚠ ${n} aktif hata` : "● hata yok";
  if (hata.dataset.k && hata.style.display === "block") detay(hata.dataset.k);   // keep the numbers live
}
setInterval(sweep, 400);
const _om = es.onmessage; es.onmessage = m => { _om(m); const e = JSON.parse(m.data), k = key(e.to, e.at?.split(":")[0] || e.toFile); if (!e.ok && k) (HIST[k] ??= []).push({ t: new Date().toLocaleTimeString("tr"), ms: e.ms, detail: e.detail }); };
</script>
</body>
</html>
