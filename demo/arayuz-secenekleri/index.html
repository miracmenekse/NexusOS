<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusOS · Arayüz seçenekleri</title>
<style>
  :root { --bg:#070b14; --fg:#cfe3ff; --dim:#6b7fa3; --acc:#4fd1ff; --err:#ff4d5e; --card:#0d1628; --line:#22355a; --ok:#6ee7a0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif; }
  header { padding:20px 20px 0; max-width:1200px; margin:auto; }
  h1 { margin:0; font-size:18px; letter-spacing:.08em; }
  header p { color:var(--dim); margin:4px 0 14px; }
  nav { display:flex; gap:8px; flex-wrap:wrap; }
  nav button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font:inherit; }
  nav button.on { border-color:var(--acc); color:var(--acc); }
  #ozet { max-width:1200px; margin:12px auto 0; padding:0 20px; color:var(--dim); }
  main { max-width:1200px; margin:auto; padding:16px 20px 40px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .k { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .k h3 { margin:0; padding:10px 14px 0; font-size:15px; }
  .k h3 small { color:var(--dim); font-weight:400; }
  .sahne { position:relative; height:190px; margin:10px 14px; border-radius:8px; background:#050810; border:1px solid #16233f; overflow:hidden; font-size:11px; }
  .b { position:absolute; bottom:0; background:#13203a; border:1px solid #2b4a7a; }
  .b.h { background:#4fd1ff33; border-color:var(--acc); }
  .b.r { background:#ff4d5e33; border-color:var(--err); }
  .o { position:absolute; background:#0d1628ee; border:1px solid var(--acc); border-radius:8px; padding:4px 8px; color:var(--fg); }
  .o.d { border-color:var(--line); color:var(--dim); }
  .ic { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--acc); color:#001; display:grid; place-items:center; font-weight:700; }
  ul { margin:0; padding:0 14px 14px 30px; }
  li.a::marker { color:var(--ok); content:"+ "; } li.z::marker { color:var(--err); content:"− "; }
  li { margin:2px 0; }
  .not { padding:0 14px 12px; color:var(--dim); font-size:12px; margin-top:auto; }

  #canli { max-width:1200px; margin:16px auto 0; padding:0 20px; }
  #canli h2 { font-size:15px; margin:0 0 6px; } #canli p { color:var(--dim); margin:0 0 8px; }
  #st { position:relative; height:380px; border:1px solid var(--line); border-radius:12px; background:#050810; overflow:hidden; cursor:pointer; }
  #w { position:absolute; inset:0; transition:transform .9s cubic-bezier(.3,.7,.2,1); transform-origin:0 0; }
  .g { position:absolute; width:22%; height:30%; border:1px solid #2b4a7a; border-radius:12px; background:#0d1628; transition:opacity .6s; }
  .g > span { position:absolute; left:8px; top:4px; color:var(--dim); font-size:12px; }
  .f { position:absolute; width:22%; height:34%; bottom:12%; background:#13203a; border:1px solid #2b4a7a; border-radius:3px; }
  .f i { position:absolute; left:50%; top:-16px; transform:translateX(-50%); font:normal 7px system-ui; color:var(--fg); white-space:nowrap; opacity:0; transition:opacity .5s; }
  .f.bad { background:#ff4d5e44; border-color:var(--err); animation:p 1.1s infinite; }
  .f.src { border-color:#ffb84d; background:#ffb84d33; }
  @keyframes p { 50% { box-shadow:0 0 8px var(--err); } }
  #st.zoom .g:not(.on) { opacity:.12; } #st.zoom .g.on .f i { opacity:1; }
  #st .gerek { position:absolute; left:12px; right:12px; bottom:10px; background:#0d1628ee; border:1px solid var(--err); border-radius:8px; padding:6px 10px; display:none; }
  #st.zoom .gerek { display:block; }
</style>
</head>
<body>
<header>
  <h1>NEXUSOS · ARAYÜZ SEÇENEKLERİ</h1>
  <p>Her özellik için 5 farklı arayüz. Çizimler kaba taslaktır; seçtiğin demoya dönüşür.</p>
  <nav id="nav"></nav>
</header>
<div id="ozet"></div>
<section id="canli"><h2>Canlı örnek · gruba yakınlaşma</h2>
<p>Bir servise (gruba) tıkla: önce gruba yakınlaşır, hatanın hangi dosyada başladığı grubun içinde görünür. Boşluğa tıkla ya da Esc: geri.</p>
<div id="st"><div id="w"></div><div class="gerek" id="gerek"></div></div></section>
<main id="m"></main>
<script>
// ortak mini sahne: kod şehri binaları
const sehir = (extra = "", yuk = [40,70,55,90,45]) =>
  yuk.map((h, i) => `<div class="b ${i==3?'h':i==1?'r':''}" style="left:${12+i*17}%;width:12%;height:${h}%"></div>`).join("") + extra;

const OZ = {
 ses: ["Ses", "Klavyesiz komut. Kaynak notu: ses teknik olarak çalışsa da ofiste kullanıcılar direnç gösterdi (Getaviz); bakış+ses birlikte belirsizliği çözüyor."],
 dokunma: ["Dokunma / jest", "Fare olmadan gezinme ve seçim. Bileğe/avuca sabit paneller yorgunluğu azaltıyor; bakışta Midas Touch riski var."],
 gecis: ["Görünüm geçişi", "Kod şehri ↔ servis trafiği ↔ agent ofisi arasında kaybolmadan gezinme (semantik yakınlaşma, bağlam koruma)."],
 panel: ["Detay paneli", "Bir nesneye inince bilginin nerede ve nasıl görüneceği. 2B pencere kalabalığından kaçınmak hedef."],
};

const S = {
ses: [
 { ad:"Komut şeridi", alt:"altta canlı altyazı",
   ui: sehir(`<div class="o" style="left:10%;right:10%;bottom:8px">🎙 “payment-service'e git” <span style="color:var(--dim)">· anlaşıldı</span></div>`),
   a:["Ne duyulduğu görünür; hata anında fark edilir","Yapması en kolay","Mevcut sahneyi kapatmaz"],
   z:["Sessiz ortamda ve ofiste utandırıcı olabilir","Belirsiz isimde (iki benzer servis) çözüm sunmaz"] },
 { ad:"Hayalet etiketler", alt:"her nesnenin üstünde söylenecek kelime",
   ui: sehir(["10","27","44","61","78"].map((l,i)=>`<div class="o" style="left:${l-2}%;top:${20+i*6}px;padding:1px 6px">${["auth","cart","pay","db","mail"][i]}</div>`).join("")),
   a:["Domain terimlerini hatırlama sorununu çözer","Üst üste binen nesnelerde seçimi netleştirir","Öğrenme eğrisi çok kısa"],
   z:["Çok nesnede etiket kirliliği","Etiketler sahneyi örter"] },
 { ad:"Halka imleç", alt:"bakış noktasında dinleme halkası",
   ui: sehir(`<div style="position:absolute;left:64%;top:40%;width:46px;height:46px;border:2px solid var(--acc);border-radius:50%;box-shadow:0 0 18px var(--acc)"></div><div class="o d" style="left:62%;top:14%">“bunu aç”</div>`),
   a:["Bakış+ses: “bunu” diyerek belirsizlik çözülür","Gözü işgal etmez","Fütüristik, projenin tonuna uyar"],
   z:["Göz takibi donanımı ister","Midas Touch: bakınca yanlış seçme riski (300–1000 ms bekleme gerekir)"] },
 { ad:"Konuşan asistan", alt:"sohbet balonu, sesli cevap",
   ui: sehir(`<div class="o" style="right:8px;top:8px;width:46%">Hangi servis yavaş?<br><span style="color:var(--acc)">▶ db: ort. 840 ms</span></div>`),
   a:["Doğal dille soru, cevap sahnede vurgulanır","Soru–cevap geçmişi var","Ses+metin birlikte, hatayı yakalar"],
   z:["LLM yanlış anlayıp yanlış nesneyi gösterebilir","Gecikme (yerel model) akışı keser","Sohbet balonu alan kaplar"] },
 { ad:"Komut paleti", alt:"söylerken öneri listesi daralır",
   ui: sehir(`<div class="o" style="left:20%;right:20%;top:8px">🎙 “pay…”<br><span style="color:var(--acc)">payment-service</span><br><span style="color:var(--dim)">payment-gateway</span></div>`),
   a:["Belirsiz komutta kullanıcı seçer, yanlış ışınlanma olmaz","Hatalı tanıma tolere edilir"],
   z:["Konuşmayla birlikte bakışı listeye çevirmek gerekir","Hızlı akışı yavaşlatır"] },
],
dokunma: [
 { ad:"Çok parmaklı yüzey", alt:"sıkıştır / çevir / sürükle",
   ui: sehir(`<div class="ic" style="left:35%;top:40%">1</div><div class="ic" style="left:55%;top:55%">2</div><div style="position:absolute;left:38%;top:45%;width:20%;border-top:2px dashed var(--acc)"></div>`),
   a:["Herkesin tanıdığı jestler","Ek donanım gerekmez (dokunmatik ekran)"],
   z:["Dik ekranda kol yorulur","Kod şehrinde dokunmak parmakla örtülür","3B’de derinlik jesti zor"] },
 { ad:"Radyal menü", alt:"basılı tut, halkadan seç",
   ui: sehir(`<div style="position:absolute;left:62%;top:18%;width:80px;height:80px;border:2px solid var(--acc);border-radius:50%"></div>`+["aç","izle","kaynak","onar"].map((t,i)=>`<div class="o" style="left:${[62,76,62,48][i]}%;top:${[8,36,64,36][i]}%;padding:1px 6px">${t}</div>`).join("")),
   a:["Hızlı, kas hafızası oluşur","Başparmakla tek elle olur","Eylemler nesneye bağlı"],
   z:["En fazla 6–8 eylem","Parmak seçenekleri kapatır","Keşfedilebilirliği düşük"] },
 { ad:"Avuç / bilek paneli", alt:"el takibi, panel avucun üstünde",
   ui: sehir(`<div style="position:absolute;right:10px;bottom:10px;width:90px;height:70px;border:2px solid var(--acc);border-radius:10px;padding:4px">☐ filtre<br>☐ katman<br>☐ geçmiş</div>`),
   a:["Kaynaklarda etkileşim maliyetini ve yorgunluğu düşürüyor","Pencere kalabalığı yok","Özgün, esin kaynaklarımızla örtüşüyor"],
   z:["El takibi kamera/donanım ister","Bilekte uzun süreli kullanım yorucu","Dik ekranda uygulaması belirsiz"] },
 { ad:"Kenar şeritleri", alt:"ekran kenarında kaydırıcılar",
   ui: sehir(`<div style="position:absolute;right:0;top:0;bottom:0;width:18px;background:#4fd1ff22;border-left:1px solid var(--acc)"></div><div style="position:absolute;left:0;right:0;bottom:0;height:18px;background:#4fd1ff22;border-top:1px solid var(--acc)"></div><div class="o d" style="right:24px;top:8px">zoom</div><div class="o d" style="left:8px;bottom:24px">zaman</div>`),
   a:["Sahne boş kalır","Parmak sahneyi örtmez","Değer ayarı (zoom, zaman) hassas"],
   z:["Kenarlara uzanmak yorucu","Sadece sürekli değerlere uygun","Çoklu şerit karışık"] },
 { ad:"Haritaya dokun ve ışınlan", alt:"köşede minimap, dokununca git",
   ui: sehir(`<div style="position:absolute;right:8px;bottom:8px;width:70px;height:46px;border:1px solid var(--acc);background:#0d1628"><div style="position:absolute;left:24px;top:18px;width:8px;height:8px;background:var(--acc)"></div></div>`),
   a:["Konumu her an gösterir (kaybolma yok)","Büyük sistemde hızlı geçiş","Tek dokunuşla hedefe"],
   z:["Küçük hedefe isabet zor","Köşede yer ister","Sıçrayınca bağlam kopar"] },
],
gecis: [
 { ad:"Tek sahnede yakınlaşma", alt:"semantik zoom: şehir → bina → trafik",
   ui: sehir(`<div class="o" style="left:8px;top:8px">şehir ▸ bina ▸ <span style="color:var(--acc)">çağrılar</span></div>`),
   a:["Kopukluk yok, süreklilik","Kaynaklardaki tavsiye (ISA: güneş sistemi→kat)","Anlatması en kolay"],
   z:["Üç farklı veriyi tek sahneye sığdırmak zor","Her seviyede ayrı render, mühendislik yükü"] },
 { ad:"Üçlü bölünmüş ekran", alt:"yan yana üç görünüm",
   ui: `<div style="display:flex;height:100%;gap:2px"><div style="flex:1;border:1px solid #2b4a7a;padding:4px">şehir</div><div style="flex:1;border:1px solid var(--acc);padding:4px">trafik</div><div style="flex:1;border:1px solid #2b4a7a;padding:4px">agent</div></div>`,
   a:["Üçü aynı anda görünür; ilişki kolay bağlanır","Basit uygulama"],
   z:["Her biri küçülür, ayrıntı kaybolur","Bölünmüş dikkat, bilişsel yük","Telefonda/küçük ekranda olmaz"] },
 { ad:"Alt sekme şeridi", alt:"tek ekran, anahtar",
   ui: sehir(`<div style="position:absolute;left:0;right:0;bottom:0;height:26px;background:#0d1628;display:flex;gap:8px;padding:4px 8px"><span style="color:var(--acc)">▌şehir</span><span>trafik</span><span>agent</span></div>`),
   a:["Her görünüm tam ekran","Alışıldık, öğrenmesi gerekmez"],
   z:["Görünüm değişince bağlam kaybı","Ayrı uygulamalar gibi hissettirir","Fütüristik değil"] },
 { ad:"Saydam katman karışımı", alt:"kaydırıcıyla üst üste bindirme",
   ui: `<div style="position:absolute;inset:0;opacity:.7">${sehir()}</div><div style="position:absolute;inset:0;background:radial-gradient(circle at 60% 40%,#4fd1ff44,transparent 50%)"></div><div class="o" style="left:20%;right:20%;bottom:8px;text-align:center">şehir ━━━●━ trafik</div>`,
   a:["Yapı ve çalışma anı birlikte görünür (çağrılar binalara oturur)","Çok özgün","Görünümler arası ilişki doğal"],
   z:["Üst üste binince okunmaz (görsel kirlilik)","Üç katmanda zorlaşır","Yeni etkileşim tasarımı gerekir"] },
 { ad:"Minimap + gökyüzü yansıtma", alt:"yakınlaştıkça genel mimari üstte kalır",
   ui: sehir(`<div style="position:absolute;left:8px;right:8px;top:6px;height:34px;border:1px dashed var(--acc);border-radius:6px;padding:2px 6px;color:var(--dim)">gökyüzü: tüm mimari ▲ buradasın</div>`),
   a:["Odaklanırken bağlam kaybolmaz (ISA)","Konum hep belli"],
   z:["Üst bant sahneyi küçültür","Sadece yapı için doğal, agent ofisine uymaz"] },
],
panel: [
 { ad:"Nesneye yapışık balon", alt:"binaya bağlı ok",
   ui: sehir(`<div class="o" style="left:50%;top:10px;width:46%">payment · 840 ms<br><span style="color:var(--err)">3 hata</span></div><div style="position:absolute;left:62%;top:46px;height:24px;border-left:1px solid var(--acc)"></div>`),
   a:["İlişki net: bilgi nesnenin yanında","Bağlam bozulmaz"],
   z:["Birden çok balon üst üste biner","Nesne kameradan çıkınca kaybolur"] },
 { ad:"Sağ çekmece", alt:"geleneksel yan panel",
   ui: sehir(`<div style="position:absolute;right:0;top:0;bottom:0;width:38%;background:#0d1628;border-left:1px solid var(--acc);padding:6px">payment<br>hata: 3<br>son: timeout</div>`),
   a:["Çok bilgi sığar, düzgün okunur","Standart, kolay uygulanır"],
   z:["Sahnenin üçte birini yer","2B pencere, projenin yenilik iddiasına ters"] },
 { ad:"Yüzen yarı saydam kart", alt:"uzayda sabit, kullanıcıyı izler",
   ui: sehir(`<div class="o" style="left:56%;top:12px;width:40%;opacity:.8;backdrop-filter:blur(3px)">payment<br>840 ms · 3 hata</div><div class="o d" style="left:8px;top:12px;width:30%;opacity:.6">auth<br>12 ms</div>`),
   a:["Sahne arkadan görünür","Birden çok kart yan yana (karşılaştırma)","Fütüristik"],
   z:["Kartlar nesneyi örtebilir (occlusion)","Konumlandırma otomatiğe ihtiyaç duyar (DuoZone benzeri)"] },
 { ad:"Alt çekmece", alt:"aşağıdan çıkar, kaydırılır",
   ui: sehir(`<div style="position:absolute;left:0;right:0;bottom:0;height:42%;background:#0d1628;border-top:1px solid var(--acc);padding:6px">payment-service · son 5 dk · 3 hata</div>`),
   a:["Küçük ekrana uygun","Sahne üstte kalır, genişlik kullanılır"],
   z:["Şehrin alt kısmını örter","Ayrı bir mod gibi çalışır"] },
 { ad:"Zaman şeridi + özet", alt:"nesne altında zaman akışı",
   ui: sehir(`<div style="position:absolute;left:8px;right:8px;bottom:8px;height:30px;background:#0d1628;border:1px solid var(--line)"><div style="position:absolute;left:30%;width:3px;top:4px;bottom:4px;background:var(--err)"></div><div style="position:absolute;left:62%;width:3px;top:4px;bottom:4px;background:var(--err)"></div></div>`),
   a:["Olayları zamanda gösterir (trafik+agent için doğal)","Geçmişe sarma mümkün"],
   z:["Anlık detay (metin) göstermez","Başka bir panelle birlikte gerekir"] },
],
};

const nav = document.getElementById("nav"), m = document.getElementById("m"), oz = document.getElementById("ozet");
function goster(k) {
  [...nav.children].forEach(b => b.classList.toggle("on", b.dataset.k === k));
  oz.textContent = OZ[k][1];
  m.innerHTML = S[k].map((x, i) => `<section class="k"><h3>${i+1}. ${x.ad} <small>· ${x.alt}</small></h3>
    <div class="sahne">${x.ui}</div>
    <ul>${x.a.map(t=>`<li class="a">${t}</li>`).join("")}${x.z.map(t=>`<li class="z">${t}</li>`).join("")}</ul></section>`).join("");
}
for (const k in OZ) { const b = document.createElement("button"); b.textContent = OZ[k][0]; b.dataset.k = k; b.onclick = () => goster(k); nav.append(b); }

// canlı örnek: grup = servis, bina = dosya; sarı = hatayı gönderen, kırmızı = hatanın başladığı dosya
const G = [
 { id:"gateway",   x:6,  y:12, files:[["routing.py"],["app.py"]], not:"Hata yok." },
 { id:"orders",    x:38, y:12, files:[["order_handler.py"],["inventory_client.py","src"],["payment_client.py","src"],["order.py"]], not:"Bu serviste hata yok; alt servislerden gelen hatalar sarı dosyalardan çıkıyor." },
 { id:"inventory", x:72, y:6,  files:[["stock.py","bad"]], not:"Hata kaynağı: <b>orders/clients/inventory_client.py</b> → <b>inventory/store/stock.py</b> (/reserve) · {ok:false}: stok yetersiz." },
 { id:"payments",  x:72, y:56, files:[["card.py","bad"]], not:"Hata kaynağı: <b>orders/clients/payment_client.py</b> → <b>payments/provider/card.py</b> (/charge) · büyük tutar reddedildi." },
];
const st = document.getElementById("st"), w = document.getElementById("w"), ge = document.getElementById("gerek");
w.innerHTML = G.map(g => `<div class="g" data-i="${G.indexOf(g)}" style="left:${g.x}%;top:${g.y}%"><span>${g.id}</span>` +
  g.files.map(([n,c],i)=>`<div class="f ${c||""}" style="left:${8+i*(84/g.files.length)}%;width:${Math.min(22,76/g.files.length)}%"><i>${n}</i></div>`).join("") + `</div>`).join("");
function ac(i) {
  if (i == null) { w.style.transform = ""; st.classList.remove("zoom"); w.querySelectorAll(".g").forEach(e=>e.classList.remove("on")); return; }
  const g = G[i], W = st.clientWidth, H = st.clientHeight, s = 3.2;
  const cx = (g.x + 11) / 100 * W, cy = (g.y + 15) / 100 * H;   // group center
  w.style.transform = `translate(${W/2 - cx*s}px,${H/2 - cy*s - 20}px) scale(${s})`;
  st.classList.add("zoom");
  w.querySelectorAll(".g").forEach((e,j)=>e.classList.toggle("on", j==i));
  ge.innerHTML = `<b>${g.id}</b> · ${g.not}`;
}
st.onclick = e => { const g = e.target.closest(".g"); ac(g && !(st.classList.contains("zoom") && g.classList.contains("on") === false) ? +g.dataset.i : null); };
addEventListener("keydown", e => e.key === "Escape" && ac(null));
goster("ses");
</script>
</body>
</html>
