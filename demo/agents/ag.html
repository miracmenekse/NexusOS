<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusOS · Agent ağı</title>
<style>
  :root { --bg:#070b14; --stage:#0a1222; --fg:#cfe3ff; --dim:#6b7fa3; --card:#0d1628; --line:#22355a; --link:#2b4a7a; --glow:.55; }
  :root.light { --bg:#eef1fb; --stage:#f7f8ff; --fg:#26304d; --dim:#7a84a3; --card:#ffffff; --line:#d9def2; --link:#b9c1e6; --glow:.25; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 20px 6px; }
  h1 { margin:0; font-size:17px; letter-spacing:.07em; } header p { margin:0; color:var(--dim); flex:1 1 280px; }
  button, select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 12px; font:inherit; cursor:pointer; }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; padding:8px 20px 24px; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } }
  #st { position:relative; aspect-ratio:780/560; background:var(--stage); border:1px solid var(--line); border-radius:16px; overflow:hidden;
        background-image:radial-gradient(circle at 42% 50%, color-mix(in srgb,#ff7b9c 12%,transparent), transparent 55%); }
  #lines { position:absolute; inset:0; width:100%; height:100%; }
  #lines path { fill:none; stroke:var(--link); stroke-width:1.5; stroke-dasharray:3 6; opacity:.25; transition:opacity .6s; }
  #lines path.on { opacity:.9; }
  .n { position:absolute; transform:translate(-50%,-50%); text-align:center; transition:opacity .6s, filter .6s; }
  .n.off { opacity:.18; filter:grayscale(1); }
  .n svg { width:64px; height:64px; display:block; margin:auto; overflow:visible; }
  .n.hub svg { width:92px; height:92px; }
  .n .nm { font-size:12px; font-weight:600; color:var(--c); }
  .n .halo { position:absolute; left:50%; top:32px; width:78px; height:78px; margin:-39px 0 0 -39px; border-radius:50%; border:2px solid var(--c); opacity:0; }
  .n.hub .halo { top:46px; width:112px; height:112px; margin:-56px 0 0 -56px; }
  .n.talk .halo { animation:ring 1.2s ease-out infinite; } @keyframes ring { from { opacity:.9; transform:scale(.8); } to { opacity:0; transform:scale(1.35); } }
  .n.wait .halo { opacity:.55; border-style:dashed; }
  .n.work .halo { opacity:.9; border-style:dashed; animation:spin 3s linear infinite; }
  .n.done .halo { opacity:.9; border-style:solid; border-color:#6ee7a0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #lines path.on { animation:march 1s linear infinite; } @keyframes march { to { stroke-dashoffset:-18; } }
  .doc { position:absolute; transform:translate(-50%,-50%); background:var(--card); border:1px solid var(--c); border-radius:8px; padding:3px 8px; font-size:10px; max-width:128px; box-shadow:0 0 12px color-mix(in srgb,var(--c) 35%,transparent); animation:in .35s; pointer-events:none; }
  .n.sel .nm { text-decoration:underline; }
  .n.talk svg { filter:drop-shadow(0 0 10px var(--c)); }
  .n { cursor:pointer; }
  .tool { position:absolute; transform:translate(-50%,-50%); width:92px; padding:6px 4px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:11px; color:var(--dim); transition:.4s; }
  .tool.hit { border-color:var(--c); color:var(--fg); box-shadow:0 0 16px color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent); }
  .tool b { display:block; font-size:16px; }
  .cust { position:absolute; transform:translate(-50%,-50%); width:130px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px; text-align:center; font-size:12px; }
  .cust b { display:block; font-size:22px; } .cust.talk { border-color:#f2c14e; box-shadow:0 0 18px #f2c14e66; }
  .bub { position:absolute; transform:translate(-50%,-100%); max-width:190px; background:var(--card); border:1px solid var(--c); border-radius:12px; padding:5px 9px; font-size:12px; z-index:5; animation:in .35s; pointer-events:none; }
  .bub.tl { color:var(--dim); border-style:dashed; } .bub.rp { font-size:11px; } @keyframes in { from { opacity:0; transform:translate(-50%,-90%); } }
  .pk { position:absolute; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); z-index:4; pointer-events:none; }
  aside { display:flex; flex-direction:column; gap:12px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .box h3 { margin:0 0 6px; font-size:12px; letter-spacing:.08em; color:var(--dim); font-weight:600; }
  .row { display:flex; align-items:center; gap:8px; padding:2px 0; } .row i { width:9px; height:9px; border-radius:50%; background:var(--c); opacity:.25; } .row.w i { opacity:1; animation:blink 1s infinite; } .row.d i { opacity:1; } .row span:last-child { margin-left:auto; color:var(--dim); font-size:12px; }
  @keyframes blink { 50% { opacity:.3; } }
  #log { max-height:210px; overflow:auto; font-size:12px; } #log div { padding:2px 0 2px 8px; border-left:3px solid var(--c); margin:3px 0; }
  .tl { display:flex; align-items:center; gap:10px; padding:0 20px 4px; } .tl input { flex:1; accent-color:#ff7b9c; } .tl span { font:12px ui-monospace,monospace; color:var(--dim); min-width:84px; text-align:right; }
  #uy { position:absolute; top:10px; right:10px; z-index:6; display:grid; gap:6px; width:min(260px,45%); }
  .n.stuck .halo { opacity:1; border:3px solid #ffb84d; animation:ring 1s ease-out infinite; } .n.stuck .nm { color:#ffb84d; }
  .row { cursor:pointer; } .row.sel span:nth-child(2) { text-decoration:underline; } .tool { cursor:pointer; }
  #sonuc { font-size:18px; font-weight:700; } .ok { color:#6ee7a0; } .no { color:#ff7a7a; }
</style>
</head>
<body>
<header>
  <h1>NEXUSOS · AGENT AĞI</h1>
  <p id="baslik">…</p>
  <a href="ofis2.html" id="diger">ofis görünümü</a><button id="pl">⏸</button><button id="rs">⏮ baştan</button>
  <select id="sp"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <button id="th">☀ / ☾</button>
</header>
<div class="tl"><input type="range" id="tl" min="0" max="1" step="0.1" value="0" aria-label="zaman çizelgesi"><span id="tlt">0:00</span></div>
<div class="wrap">
  <div id="st"><div id="uy"></div><svg id="lines" viewBox="0 0 780 560" preserveAspectRatio="none"></svg></div>
  <aside>
    <div class="box"><h3>AGENT'LAR <span style="font-weight:400">· dokun: ne yaptı?</span></h3><div id="ags"></div></div>
    <div class="box" id="ayr" hidden><h3>AYRINTI <span id="kapat" style="float:right;cursor:pointer;font-weight:400">✕</span></h3><div id="panel"></div></div>
    <div class="box"><h3>SONUÇ</h3><div id="sonuc">…</div></div>
    <div class="box"><h3>KONUŞMA</h3><div id="log"></div></div>
  </aside>
</div>
<script src="altlik.js"></script>
<script>
// agents hand work to each other: a request goes agent -> agent (chains), several run in parallel, results come back one by one.
// events are timed (t, seconds); a clock fires them, so overlapping work really overlaps.
// Everything below is derived from the data (altlik.py model): who is where, colours, which tool card belongs to whom.
const PAL = ["#4fd1ff", "#7ee787", "#c792ea", "#ffab70", "#79c0ff", "#56d4bc", "#e3b341"];
const SLOT = [[66,16],[80,36],[80,64],[66,84],[42,86],[42,14],[20,86],[20,14],[92,50]];   // up to 9 hand-placed slots, then a ring
const HUBTOOL = [[24,18],[24,82],[58,32],[58,68],[8,18],[8,82]];                          // cards for tools the hub itself uses
let COL, POS, TOOL, TCOL, ICON, HUB, INSAN;
function layout(d) {
  COL = {}; POS = {}; TOOL = {}; TCOL = {}; ICON = {}; INSAN = new Set(); let i = 0, j = 0, h = 0;
  for (const [a, x] of Object.entries(d.agents)) {
    COL[a] = x.renk || (x.tur === "insan" ? "#f2c14e" : x.tur === "ana" ? "#ff7b9c" : PAL[j++ % PAL.length]);
    if (x.tur === "insan") { POS[a] = [11, 50 + 24 * INSAN.size]; INSAN.add(a); }
    else if (x.tur === "ana") { HUB = a; POS[a] = [42, 50]; }
    else POS[a] = SLOT[i++ % SLOT.length];
  }
  const sub = Object.keys(d.agents).filter(a => d.agents[a].tur === "agent");
  if (sub.length > SLOT.length) sub.forEach((a, k) => { const w = (k + .5) / sub.length * 2 * Math.PI;   // many agents: a ring around the hub
    POS[a] = [42 + 40 * Math.cos(w), 50 + 40 * Math.sin(w)]; });
  const n = {};
  for (const e of d.events) if (e.kind === "tool" && !TOOL[e.station]) {   // a card sits outward from the first agent that uses it
    const a = e.agent, [x, y] = POS[a], k = n[a] = (n[a] || 0) + 1;
    TOOL[e.station] = a === HUB ? HUBTOOL[h++ % HUBTOOL.length] : [Math.min(94, Math.max(6, x + (x >= 42 ? 15 : -15))), Math.min(92, Math.max(8, y + (k - 1) * 13 - 2))];
    TCOL[e.station] = a; ICON[e.station] = d.stations[e.station]?.icon || "🔧";
  }
}
const $ = id => document.getElementById(id), st = $("st"), lines = $("lines");
const robot = c => `<svg viewBox="0 0 64 64" style="--c:${c}"><line x1="32" y1="4" x2="32" y2="13" stroke="${c}" stroke-width="2.5"/><circle cx="32" cy="4" r="3.5" fill="${c}"/>
  <rect x="10" y="13" width="44" height="32" rx="11" fill="#0d1a30" stroke="${c}" stroke-width="2.5"/>
  <circle cx="23" cy="29" r="5" fill="${c}"/><circle cx="41" cy="29" r="5" fill="${c}"/><circle cx="24.5" cy="27.5" r="1.7" fill="#fff"/><circle cx="42.5" cy="27.5" r="1.7" fill="#fff"/>
  <rect x="17" y="48" width="30" height="12" rx="6" fill="#0d1a30" stroke="${c}" stroke-width="2"/></svg>`;
const pt = (k, tool) => tool ? TOOL[k] : POS[k];
let D, evs, now, nxt, timer, nodes, tools, bub, links, waiting, docs, quiet = false, olan = [], sel = null;   // quiet: seeking, state only, no animation
const sp = () => +$("sp").value;

function build(d) {
  D = d; evs = [...d.events].sort((a, b) => a.t - b.t); $("baslik").textContent = d.title;
  st.querySelectorAll(".n,.tool,.cust,.bub,.pk,.doc").forEach(e => e.remove()); lines.innerHTML = "";
  nodes = {}; tools = {}; bub = {}; links = {}; waiting = {}; docs = {}; now = 0; nxt = 0; olan = []; layout(d);
  for (const a of INSAN) {
    const c = document.createElement("div"); c.className = "cust"; c.style.cssText = `left:${POS[a][0]}%;top:${POS[a][1]}%`;
    c.innerHTML = `<b>👤</b>${a}<br><span style="color:var(--dim)">${d.agents[a].rol || ""}</span>`; st.append(c); nodes[a] = c;
  }
  for (const a of Object.keys(POS).filter(k => !INSAN.has(k))) {
    const n = document.createElement("div"); n.className = "n" + (a === HUB ? " hub" : " off"); n.style.cssText = `left:${POS[a][0]}%;top:${POS[a][1]}%;--c:${COL[a]}`;
    n.innerHTML = `<div class="halo"></div>${robot(COL[a])}<div class="nm">${a}</div>`; n.onclick = () => sec("ajan", a);
    st.append(n); nodes[a] = n;
  }
  for (const [s, [x, y]] of Object.entries(TOOL)) {
    const t = document.createElement("div"); t.className = "tool"; t.style.cssText = `left:${x}%;top:${y}%;--c:${COL[TCOL[s]]}`;
    t.innerHTML = `<b>${ICON[s]}</b>${d.stations[s]?.label || s}`; t.onclick = () => sec("arac", s); st.append(t); tools[s] = t;
  }
  $("ags").innerHTML = Object.keys(COL).filter(a => !INSAN.has(a)).map(a => `<div class="row" id="r-${a}" style="--c:${COL[a]}"><i></i><span>${a}</span><span>${a === HUB ? "hazır" : "bekliyor"}</span></div>`).join("");
  for (const r of $("ags").children) r.onclick = () => sec("ajan", r.id.slice(2));
  $("log").innerHTML = ""; $("sonuc").textContent = "…"; $("sonuc").className = "";
}
function link(a, b, tool) {   // curve drawn the first time two nodes talk
  const k = a + "|" + b; if (links[k]) return links[k];
  const [x1, y1] = pt(a), [x2, y2] = pt(b, tool), p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x1 * 7.8},${y1 * 5.6} Q${(x1 + x2) * 3.9},${(y1 + y2) * 2.8 - 30} ${x2 * 7.8},${y2 * 5.6}`); lines.append(p); return links[k] = p;
}
function setRow(a, cls, txt) { const r = $("r-" + a); if (!r) return; r.className = "row " + cls; r.lastElementChild.textContent = txt; const n = nodes[a]; if (!n) return;   // ring: dashed spin = working, dashed = waiting for an answer, green = done
  n.classList.toggle("wait", cls === "w" && /yanıt/.test(txt)); n.classList.toggle("work", cls === "w" && !/yanıt/.test(txt)); n.classList.toggle("done", cls === "d");
  if (cls === "d") { docs[a]?.remove(); delete docs[a]; } }
function doc(a, icon, text) {   // the piece of work an agent is holding, floating beside it
  docs[a]?.remove(); const [x, y] = POS[a], d = document.createElement("div"); d.className = "doc"; d.style.cssText = `left:${x + (x > 50 ? -9 : 9)}%;top:${y + 7}%;--c:${COL[a]}`;
  d.textContent = icon + " " + text; st.append(d); docs[a] = d; }
function packet(from, to, color, tool) {
  if (quiet) { link(from, to, tool); return; }
  const [x1, y1] = pt(from), [x2, y2] = pt(to, tool), p = document.createElement("div"); p.className = "pk"; p.style.cssText = `--c:${color};left:${x1}%;top:${y1}%`; st.append(p);
  p.animate([{ left: x1 + "%", top: y1 + "%" }, { left: x2 + "%", top: y2 + "%" }], { duration: 1100 / sp(), easing: "ease-in-out" }).onfinish = () => p.remove();
  const lk = link(from, to, tool); lk.classList.add("on"); clearTimeout(lk._t); lk._t = setTimeout(() => lk.classList.remove("on"), 4500 / sp());   // idle links dim again
}
function say(a, text, cls) {
  if (quiet) return;
  bub[a]?.remove(); const [x, y] = POS[a], b = document.createElement("div"); b.className = "bub " + (cls || ""); b.style.cssText = `left:${x}%;top:${y - (INSAN.has(a) ? 11 : 9)}%;--c:${COL[a]}`; b.textContent = text; st.append(b); bub[a] = b;
  setTimeout(() => b.isConnected && b.remove(), 4200 / sp());
}
function talk(a) { if (quiet) return; const n = nodes[a]; n.classList.add("talk"); setTimeout(() => n.classList.remove("talk"), 1600 / sp()); }
function logLine(from, to, text) { const l = document.createElement("div"); l.style.setProperty("--c", COL[from]); l.innerHTML = `<b style="color:${COL[from]}">${from}${to ? " → " + to : ""}</b> ${text}`; $("log").append(l); $("log").scrollTop = 1e5; }
function fire(e) {
  olan.push({ e, at: e.t });
  if (e.kind === "msg") {
    const { from: f, to: t } = e;
    packet(f, t, COL[f]); say(f, e.text, e.reply ? "rp" : ""); talk(f); logLine(f, t, e.text);
    if (e.reply) {   // an answer: the asker stops waiting; "closes" lists agents whose delegated work this answer settles
      delete waiting[t + ">" + f]; setRow(f, "d", "işini verdi");
      for (const x of e.closes || []) { for (const k of Object.keys(waiting)) if (k.endsWith(">" + x) && k.startsWith(t + ">") || k.startsWith(x + ">")) delete waiting[k]; setRow(x, "d", "devretti, bitti"); }
      const w = Object.keys(waiting).find(k => k.startsWith(t + ">")); setRow(t, "w", w ? "yanıt bekliyor: " + w.split(">")[1] : "çalışıyor");
    } else if (!INSAN.has(f) && !INSAN.has(t)) {
      waiting[f + ">" + t] = 1; nodes[t].classList.remove("off"); setRow(t, "w", "çalışıyor"); setRow(f, "w", "yanıt bekliyor: " + t);
    }
  } else if (e.kind === "tool") {
    const s = e.station; packet(e.agent, s, COL[e.agent], true); quiet || tools[s].classList.add("hit"); quiet || setTimeout(() => tools[s].classList.remove("hit"), 2200 / sp());
    say(e.agent, "🔧 " + e.text, "tl"); doc(e.agent, ICON[s], e.text); logLine(e.agent, null, "🔧 " + e.text);
  } else {
    say(e.agent, e.kind === "sonuc" ? "Sonuç: " + e.text : e.text); talk(e.agent); logLine(e.agent, null, e.text);
    if (e.kind === "sonuc") { $("sonuc").textContent = e.text; $("sonuc").className = e.ok ? "ok" : "no"; setRow(HUB, "d", "bitti"); }
  }
}
function tick() {
  now += 0.1 * sp();
  if (CANLI) now = Math.min(now, (evs.at(-1)?.t ?? 0) + 1);   // live: wait at the edge for new events
  while (nxt < evs.length && evs[nxt].t <= now) fire(evs[nxt++]);
  if (nxt >= evs.length && !CANLI) { clearInterval(timer); $("pl").textContent = "▶"; }
  bar(); guncelle();
}
// detail panel + stuck warnings, recomputed from what has happened so far (altlik.js)
const renk = a => COL[a] || "#9fb0cc";
function sec(tur, ad) { sel = sel?.ad === ad ? null : { tur, ad }; guncelle(); }
$("kapat").onclick = () => { sel = null; guncelle(); };
$("uy").onclick = e => { const k = e.target.closest("[data-ajan]"); if (k) { sel = { tur: "ajan", ad: k.dataset.ajan }; guncelle(); } };
function guncelle() {
  const Dm = Altlik.durum(D, olan), T = Altlik.takilanlar(Dm, now, Altlik.ESIK), uc = new Set(T.map(k => k.uc));
  for (const [a, n] of Object.entries(nodes)) n.classList.toggle("stuck", uc.has(a));
  $("uy").innerHTML = Altlik.uyari(T, renk);
  for (const r of $("ags").children) r.classList.toggle("sel", sel?.ad === r.id.slice(2));
  $("ayr").hidden = !sel;
  if (sel) $("panel").innerHTML = sel.tur === "ajan" ? Altlik.ajanPanel(D, Dm, sel.ad, renk, now) : Altlik.aracPanel(D, Dm, sel.ad, renk);
}
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function bar() { $("tl").value = now; $("tlt").textContent = `${mmss(now)} / ${mmss(+$("tl").max)}`; }
function seek(t, yeni = D) {   // rebuild, then replay every event up to t without animation: same state as having watched it
  build(yeni); quiet = true; while (nxt < evs.length && evs[nxt].t <= t) fire(evs[nxt++]); quiet = false; now = t; bar(); guncelle();
}
$("tl").oninput = () => { const p = $("pl").textContent === "⏸"; clearInterval(timer); seek(+$("tl").value); p ? play() : ($("pl").textContent = "▶"); };
function play() { clearInterval(timer); timer = setInterval(tick, 100); $("pl").textContent = "⏸"; }
$("pl").onclick = () => $("pl").textContent === "⏸" ? (clearInterval(timer), $("pl").textContent = "▶") : (nxt >= evs.length && build(D), play());
$("rs").onclick = () => { build(D); play(); };
$("sp").onchange = () => $("pl").textContent === "⏸" && play();
$("th").onclick = () => document.documentElement.classList.toggle("light");
// the other view opens at the same moment: #t<seconds> (a plain hash survives inside the pano too)
$("diger").onclick = e => { e.currentTarget.href = "ofis2.html" + location.search + "#t" + now.toFixed(1); };
// ?canli=<url>: a running agent system; the model is re-read every second and new events are appended
const Q = new URLSearchParams(location.search), CANLI = Q.get("canli");
const ayniBas = (a, b) => JSON.stringify([Object.keys(a.agents), Object.keys(a.stations)]) === JSON.stringify([Object.keys(b.agents), Object.keys(b.stations)])
  && a.events.every((e, i) => JSON.stringify(e) === JSON.stringify(b.events[i]));
async function izle() {
  const d = await fetch(CANLI, { cache: "no-store" }).then(r => r.json()).catch(() => null);
  if (d?.events?.length && d.events.length !== D.events.length) {
    $("tl").max = d.events.at(-1).t + 2;
    if (ayniBas(D, d)) { D = d; evs.push(...d.events.slice(evs.length)); } else seek(now, d);   // history changed (a sub-agent's log arrived): rebuild at the same moment
    if (d.events.at(-1).t - now > 8) seek(d.events.at(-1).t - 2);   // fell far behind: jump to the live edge
  }
  $("baslik").textContent = D.title + (d ? " · ● canlı" : " · bağlantı yok");
  setTimeout(izle, 1000);
}
fetch(CANLI || Q.get("data") || "telekom-ag.json").then(r => r.json()).then(d => {
  $("tl").max = (d.events.at(-1)?.t ?? 0) + 2; build(d); const t0 = +(/^#t([\d.]+)$/.exec(location.hash)?.[1] || 0);
  if (CANLI) { seek(Math.max(0, (d.events.at(-1)?.t ?? 0) - 2)); izle(); } else if (t0) seek(t0);
  play(); });
</script>
</body>
</html>
